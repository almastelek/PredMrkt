# PredExchange default configuration

[ingestion]
# WebSocket reconnect
reconnect_base_delay_sec = 1.0
reconnect_max_delay_sec = 60.0
reconnect_max_retries = 0  # 0 = infinite

# Market discovery refresh
discovery_refresh_interval_sec = 600  # 10 minutes

[storage]
# DuckDB database path (relative to cwd or absolute)
db_path = "data/predex.duckdb"

# Batch size for raw event writes
event_batch_size = 100

[markets]
# Number of markets to track
track_count = 50

# Selection criteria (volume/activity proxies)
min_volume_24h = 0
min_liquidity = 0

# Category filter: allowlist (empty = all) or denylist
# category_allowlist = ["politics", "crypto"]
# category_denylist = []

# Manual pin list: market IDs to always track (in addition to top N)
# pinned_markets = []

[polymarket]
gamma_api_base = "https://gamma-api.polymarket.com"
clob_ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
data_api_base = "https://data-api.polymarket.com"
whale_min_cash_filter = 10000
whale_ingest_page_limit = 1000
whale_ingest_max_pages = 20
whale_background_interval_sec = 300

[signals]
# Periodic episode/stats/alert pipeline (requires API run with --with-signals)
enabled_background = false
background_interval_sec = 600

# Episode + alert pipeline tunables
lookback_days = 60
gap_minutes = 30
score_since_hours = 168      # 7 days
max_alerts = 1000
forward_returns_limit = 500

# Scoring weights (logistic combine of normalized factors)
weight_timing = 0.30
weight_size = 0.20
weight_concentration = 0.15
weight_history = 0.25
weight_coordination = 0.10
weight_bias = -0.5            # shift so "average" episodes score lower

# Context adjustment
sports_market_mult = 0.70     # discount sports market edge; still surfaced separately

[logging]
level = "INFO"
# format: "json" or "console"
format = "console"
